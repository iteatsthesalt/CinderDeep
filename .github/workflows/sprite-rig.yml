name: sprite-rig
on:
  push:
    branches: [main]
    paths: ['projects/cinderdeep-3d/**', 'projects/sprite-rig/**', 'tools/check_active_version.py', '.github/workflows/sprite-rig.yml']
  pull_request:
    paths: ['projects/cinderdeep-3d/**', 'projects/sprite-rig/**', 'tools/check_active_version.py', '.github/workflows/sprite-rig.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sprite-rig
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python3 ../../tools/check_active_version.py
      - run: npm test
